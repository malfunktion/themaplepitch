name = "maplepitch-dev"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Default route for dev/staging
routes = [
  { pattern = "dev.themaplepitch.ca", custom_domain = true }
]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# OpenNext Asset Serving Configuration
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

# Shared Runtime Environment Variables
[vars]
NEXT_PUBLIC_SANITY_PROJECT_ID = "uvf97j3d"
NEXT_PUBLIC_SANITY_DATASET = "production"
NEXT_PUBLIC_SANITY_API_VERSION = "2026-08-01"
NEXT_PUBLIC_SUPABASE_URL = "https://wsbyyvtcvyhidvijvwuo.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-anon-key-here"

# Rate Limiter Binding (FIX: Changed 'name' to 'binding')
[[ratelimits]]
binding = "API_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60

# ==========================================================
# PRODUCTION ENVIRONMENT OVERRIDE
# Deploy via: wrangler deploy --env production
# ==========================================================
[env.production]
name = "maplepitch-prod"
routes = [
  { pattern = "themaplepitch.ca", custom_domain = true },
  { pattern = "www.themaplepitch.ca", custom_domain = true }
]
