<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Maple Pitch | Coming Soon</title>
    <style>
        /* Minimalist Scandinavian base */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content-wrapper {
            text-align: center;
            max-width: 900px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Main Graphic styling */
        .hero-image {
            max-width: 100%;
            height: auto;
            margin-bottom: 3rem;
        }

        /* Typography */
        h1 {
            font-weight: 300;
            font-size: 1.25rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin: 0;
            color: #333333;
        }

        /* Fixed bottom-right email link */
        .contact-link {
            position: fixed;
            bottom: 40px;
            right: 40px;
            text-decoration: none;
            color: #333333;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: color 0.2s ease-in-out;
        }

        /* Crimson red hover highlight */
        .contact-link:hover {
            color: #dc143c; 
        }

        @media (max-width: 768px) {
            .contact-link {
                position: static;
                margin-top: 4rem;
            }
            .hero-image {
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>

    <main class="content-wrapper">
        <img src="index.jpg" alt="The Maple Pitch Terminal" class="hero-image">
        
        <h1>Coming Soon</h1>
    </main>

    <a href="mailto:info@themaplepitch.ca" class="contact-link">info@themaplepitch.ca</a>

</body>
</html>
